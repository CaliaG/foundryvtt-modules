<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deck">
<meta name="theme-color" content="#14110f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Remote Deck</title>
<style>
  :root { --bg:#14110f; --panel:#221d19; --btn:#2e2722; --text:#efe6d8; --muted:#9a8f80; --accent:#e0a040; --on:#3f7d4a; --bad:#b0413e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.3 system-ui,-apple-system,sans-serif;
         padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(80px + env(safe-area-inset-bottom)) env(safe-area-inset-left);
         user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  header { position:sticky; top:0; z-index:2; background:var(--bg); display:flex; gap:6px; padding:10px 16px; overflow-x:auto; align-items:center; }
  header button { flex:none; border:0; border-radius:999px; padding:10px 16px; background:var(--panel); color:var(--text); font:inherit; font-weight:600; }
  header button.sel { background:var(--accent); color:#1a1208; }
  header { border-bottom:3px solid var(--bad); }
  header.ok { border-bottom-color:var(--on); }
  main { padding:0 16px; min-height:calc(100vh - 160px); touch-action:pan-y; }
  .head { display:flex; align-items:center; gap:12px; margin:18px 0 8px; }
  h2 { flex:none; max-width:60%; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .head input[type=range] { flex:1; min-width:0; accent-color:var(--accent); height:28px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(110px, 1fr)); gap:10px; }
  .cell { position:relative; }
  .tile { width:100%; aspect-ratio:1; border:0; border-radius:14px; background:var(--btn) center/cover no-repeat; color:var(--text);
          font:inherit; font-weight:600; padding:8px; display:flex; align-items:flex-end; justify-content:center; text-align:center;
          overflow:hidden; word-break:break-word; transition:transform .08s; }
  .tile.noimg { align-items:center; }
  .tile.img span { background:rgba(0,0,0,.65); border-radius:6px; padding:2px 6px; }
  .tile:active { transform:scale(.95); }
  .tile.on { box-shadow:inset 0 0 0 3px var(--accent); background-color:var(--on); }
  .cell.fav::before { content:"★"; position:absolute; top:6px; left:8px; z-index:1; color:var(--accent); text-shadow:0 0 3px #000; pointer-events:none; }
  .grid.cards { grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); }
  .card { width:100%; border:0; border-radius:14px; background:var(--btn); color:var(--text); font:inherit; padding:12px; text-align:left; display:flex; flex-direction:column; gap:8px; }
  .card.on { box-shadow:inset 0 0 0 3px var(--bad); }
  .card .top { display:flex; align-items:center; gap:10px; }
  .card .avatar { flex:none; width:48px; height:48px; border-radius:50%; background:var(--panel) center/cover no-repeat; }
  .card .name { font-weight:700; font-size:16px; }
  .card .badges { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
  .card .badge { background:var(--bad); color:#fff; border-radius:6px; padding:2px 6px; font-size:11px; font-weight:600; }
  .stat { display:grid; grid-template-columns:64px 1fr 56px; align-items:center; gap:8px; font-size:13px; }
  .stat .bar { height:8px; border-radius:4px; background:var(--panel); overflow:hidden; }
  .stat .fill { height:100%; background:var(--on); }
  .stat .fill.mid { background:var(--accent); }
  .stat .fill.low { background:var(--bad); }
  .stat .num { text-align:right; font-variant-numeric:tabular-nums; color:var(--muted); }
  .alt { position:absolute; top:6px; right:6px; border:0; border-radius:8px; padding:6px 8px; background:var(--bad); color:#fff; font:inherit; font-size:12px; }
  .empty { color:var(--muted); padding:24px 0; }
  #bar { position:fixed; left:16px; right:16px; bottom:calc(12px + env(safe-area-inset-bottom)); display:flex; gap:10px; }
  #bar button { flex:1; height:56px; border:0; border-radius:14px; color:#fff; font:inherit; font-size:18px; font-weight:700; }
  #pause { background:var(--btn); }
  #pause.on { background:var(--accent); color:#1a1208; }
  #stop { background:var(--bad); }
  #toast { position:fixed; left:50%; bottom:calc(80px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#000c; padding:8px 14px;
           border-radius:8px; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<header id="tabs"></header>
<main id="page"><p class="empty">In attesa di Foundry…</p></main>
<div id="bar"><button id="pause">⏸ Pausa</button><button id="stop">■ Stop audio</button></div>
<div id="toast"></div>
<script>
  // localStorage può mancare (navigazione privata): tutto funziona anche senza, solo non viene ricordato.
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };
  let token = new URLSearchParams(location.search).get("t");
  token ? store.set("deckToken", token) : (token = store.get("deckToken"));
  let tab = store.get("deckTab");
  let favs = new Set(); try { favs = new Set(JSON.parse(store.get("deckFavs") ?? "[]")); } catch {}
  let state = null, foundry = false, sse = false, tabIds = [];
  const q = "t=" + encodeURIComponent(token ?? "");
  const $ = id => document.getElementById(id);
  const keyOf = btn => JSON.stringify(btn.action);

  function toast(msg) { $("toast").textContent = msg; $("toast").classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => $("toast").classList.remove("show"), 1800); }

  async function act(action) {
    navigator.vibrate?.(15);
    try {
      const r = await fetch("action?" + q, { method: "POST", body: JSON.stringify(action) });
      if (!r.ok) toast(await r.text() || "Errore " + r.status);
    } catch { toast("Relay non raggiungibile"); }
  }

  function toggleFav(btn) {
    const k = keyOf(btn);
    favs.has(k) ? favs.delete(k) : favs.add(k);
    store.set("deckFavs", JSON.stringify([...favs]));
    navigator.vibrate?.(40);
    toast(favs.has(k) ? `★ ${btn.label} aggiunto ai preferiti` : `${btn.label} rimosso dai preferiti`);
    render();
  }

  // Tap = azione, pressione lunga (0,5 s) = aggiungi/togli dai preferiti. Se il dito si muove (swipe/scroll) non vale.
  function bindPress(tile, btn) {
    let timer, long = false, x = 0, y = 0;
    const cancel = () => clearTimeout(timer);
    tile.onpointerdown = e => { long = false; x = e.clientX; y = e.clientY; timer = setTimeout(() => { long = true; toggleFav(btn); }, 500); };
    tile.onpointermove = e => { if (Math.hypot(e.clientX - x, e.clientY - y) > 10) cancel(); };
    tile.onpointerup = tile.onpointerleave = tile.onpointercancel = cancel;
    tile.oncontextmenu = e => e.preventDefault();
    tile.onclick = () => { if (!long) act(btn.action); };
  }

  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }

  // Preferiti raggruppati per categoria d'origine ("Audio · Taverna", "Personaggi · Deck", ...).
  const imgUrl = img => /^https:/.test(img) ? img : `img?${q}&p=${encodeURIComponent(img)}`;

  // Scheda con barre (es. investigatori CoC): stesso tap/pressione lunga dei tile.
  function card(btn) {
    const c = el("button", "card" + (btn.active ? " on" : ""));
    const top = el("div", "top"), avatar = el("div", "avatar"), info = el("div");
    if (btn.img) avatar.style.backgroundImage = `url("${imgUrl(btn.img)}")`;
    info.append(el("div", "name", btn.label));
    if (btn.badges?.length) {
      const badges = el("div", "badges");
      for (const b of btn.badges) badges.append(el("span", "badge", b));
      info.append(badges);
    }
    top.append(avatar, info);
    c.append(top);
    for (const st of btn.stats) {
      const row = el("div", "stat"), bar = el("div", "bar");
      const ratio = st.max > 0 ? Math.max(0, Math.min(1, st.value / st.max)) : 0;
      const fill = el("div", "fill" + (st.total ? "" : ratio < 0.2 ? " low" : ratio < 0.5 ? " mid" : ""));
      fill.style.width = `${ratio * 100}%`;
      bar.append(fill);
      row.append(el("span", "", st.label), bar, el("span", "num", st.total ? `${st.value}` : `${st.value}/${st.max}`));
      c.append(row);
    }
    bindPress(c, btn);
    return c;
  }

  function favPage() {
    const seen = new Set(), sections = [];
    for (const p of state.pages) for (const s of p.sections) {
      const buttons = s.buttons.filter(b => favs.has(keyOf(b)) && !seen.has(keyOf(b)));
      buttons.forEach(b => seen.add(keyOf(b)));
      if (buttons.length) sections.push({ title: `${p.title} · ${s.title}`, buttons });
    }
    return { id: "fav", title: "★", sections };
  }

  function render() {
    $("tabs").classList.toggle("ok", sse && foundry);
    $("pause").classList.toggle("on", !!state?.paused);
    $("pause").textContent = state?.paused ? "▶ Riprendi" : "⏸ Pausa";
    const tabs = $("tabs"), page = $("page");
    tabs.replaceChildren();
    page.replaceChildren();
    if (!token) return page.append(el("p", "empty", "Token mancante: apri l'URL (o inquadra il QR) mostrato in Foundry."));
    if (!state) return page.append(el("p", "empty", foundry ? "Caricamento…" : "In attesa di Foundry…"));
    const pages = [favPage(), ...state.pages];
    if (!pages.some(p => p.id === tab)) tab = state.pages[0]?.id;
    tabIds = pages.map(p => p.id);
    for (const p of pages) {
      const b = el("button", p.id === tab ? "sel" : "", p.title);
      b.onclick = () => selectTab(p.id);
      tabs.append(b);
    }
    const current = pages.find(p => p.id === tab);
    if (tab === "fav" && !current.sections.length)
      return page.append(el("p", "empty", "Tieni premuto un pulsante in qualsiasi tab per aggiungerlo ai preferiti."));
    if (!current?.sections.length) return page.append(el("p", "empty", "Niente da mostrare qui."));
    for (const s of current.sections) {
      const head = el("div", "head");
      head.append(el("h2", "", s.title));
      if (s.volume) {
        const range = el("input");
        Object.assign(range, { type: "range", min: 0, max: 1, step: 0.01, value: s.volume.value, title: "Volume" });
        range.onchange = () => act({ ...s.volume.action, v: Number(range.value) });
        head.append(range);
      }
      page.append(head);
      const grid = el("div", s.buttons.some(b => b.stats) ? "grid cards" : "grid");
      if (!s.buttons.length) grid.append(el("p", "empty", "—"));
      for (const btn of s.buttons) {
        const cell = el("div", "cell" + (favs.has(keyOf(btn)) ? " fav" : ""));
        if (btn.stats) { cell.append(card(btn)); grid.append(cell); continue; }
        const t = el("button", "tile " + (btn.img ? "img" : "noimg") + (btn.active ? " on" : ""));
        t.append(el("span", "", btn.label));
        if (btn.img) t.style.backgroundImage = `url("${imgUrl(btn.img)}")`;
        bindPress(t, btn);
        cell.append(t);
        if (btn.alt) {
          const a = el("button", "alt", btn.alt.label);
          a.onclick = () => act(btn.alt.action);
          cell.append(a);
        }
        grid.append(cell);
      }
      page.append(grid);
    }
  }

  function selectTab(id, dir = 0) {
    tab = id;
    store.set("deckTab", tab);
    render();
    window.scrollTo(0, 0);
    $("tabs").querySelector(".sel")?.scrollIntoView({ inline: "center", block: "nearest" });
    if (dir) $("page").animate([{ transform: `translateX(${dir * 40}px)`, opacity: 0.3 }, { transform: "none", opacity: 1 }], { duration: 180, easing: "ease-out" });
  }

  // Swipe orizzontale sul contenuto = tab precedente/successivo (non sulla barra dei tab né sugli slider).
  let swipe = null;
  document.addEventListener("touchstart", e => {
    const t = e.touches[0];
    swipe = e.touches.length === 1 && !e.target.closest("header, input") ? { x: t.clientX, y: t.clientY, at: Date.now() } : null;
  }, { passive: true });
  document.addEventListener("touchend", e => {
    if (!swipe || !state) return;
    const t = e.changedTouches[0], dx = t.clientX - swipe.x, dy = t.clientY - swipe.y, ms = Date.now() - swipe.at;
    swipe = null;
    if (Math.abs(dx) < 60 || Math.abs(dx) < 2 * Math.abs(dy) || ms > 800) return;
    const i = tabIds.indexOf(tab) + (dx < 0 ? 1 : -1);
    if (i < 0 || i >= tabIds.length) return;
    navigator.vibrate?.(10);
    selectTab(tabIds[i], dx < 0 ? 1 : -1);
  }, { passive: true });

  $("stop").onclick = () => act({ type: "stopAllAudio" });
  $("pause").onclick = () => act({ type: "pause" });

  // Schermo sempre acceso finché la pagina è visibile (il lock decade quando si cambia app).
  const wake = () => navigator.wakeLock?.request("screen").catch(() => {});
  document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && wake());
  wake();

  if (token) {
    const es = new EventSource("events?role=deck&" + q);
    es.onopen = () => { sse = true; render(); };
    es.onerror = () => { sse = false; render(); };
    es.onmessage = e => {
      const msg = JSON.parse(e.data);
      foundry = msg.foundry;
      if (msg.kind === "state" && msg.state) state = msg.state;
      render();
    };
  }
  render();
</script>
</body>
</html>
